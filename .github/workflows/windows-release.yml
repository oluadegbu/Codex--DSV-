name: DMB self-contained Windows shadow package
on:
  push:
    branches: [codex/dmb-shadow-publication-20261012-fd92f06]
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'packaging/**'
      - 'tools/run_windows_shadow_bridge.py'
      - 'tools/run_windows_lifecycle_host.py'
      - 'tools/certify_windows_lifecycle.py'
      - 'deployment/phase10/**'
      - 'tools/windows_package_runtime.py'
      - 'tools/build_windows_package.py'
      - 'tools/check_windows_package.py'
      - 'package_tests/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'packaging/**'
      - 'tools/run_windows_shadow_bridge.py'
      - 'tools/run_windows_lifecycle_host.py'
      - 'tools/certify_windows_lifecycle.py'
      - 'deployment/phase10/**'
      - 'tools/windows_package_runtime.py'
      - 'tools/build_windows_package.py'
      - 'tools/check_windows_package.py'
      - 'package_tests/**'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m unittest discover -s certification_tests -v
      - run: PYTHONPATH=src python -m unittest discover -s control_plane_tests -v
      - run: PYTHONPATH=src python -m unittest discover -s windows_bridge_tests -v
      - run: PYTHONPATH=src:tools python -m unittest discover -s package_tests -v
      - run: PYTHONPATH=src python -m unittest discover -s operations_tests -v
      - run: PYTHONPATH=src:tools python -m unittest discover -s phase10_tests -v
  windows-package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python tools/build_windows_package.py --output artifacts/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: dmb-windows-release
          path: |
            artifacts/windows-release/*.zip
            artifacts/windows-release/RELEASE.json
            artifacts/windows-release/SHA256SUMS.txt
            artifacts/windows-release/PACKAGE_SMOKE.json
  publish-shadow-package:
    needs: [validate, windows-package]
    # A normal operations milestone must not mint a replacement of certified0.1.3.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dmb-shadow-publication-20261012-fd92f06' && contains(github.event.head_commit.message, '[publish-windows-shadow]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmb-windows-release
          path: release
      - name: Publish verified development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMB_SOURCE: ${{ github.sha }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          tag="$(jq -r .tag RELEASE.json)"
          printf '%s\n' 'Phase10 bounded lifecycle self-contained Windows package; activation WITHHELD. No task/service registration, installer, activation grant, credentials or remote endpoint included. Architecture approval is not activation approval. Exact proposed task and rollback: app/deployment/phase10. Final approval and real Windows preactivation gates remain required. Provenance: RELEASE.json and PACKAGE_SMOKE.json.' > NOTES.txt
          gh release create "$tag" --target "$DMB_SOURCE" --prerelease --title "DMB Windows shadow $tag" --notes-file NOTES.txt ./*.zip RELEASE.json SHA256SUMS.txt PACKAGE_SMOKE.json
